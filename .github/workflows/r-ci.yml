name: R CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run R tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libsqlite3-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("DBI", "RSQLite", "fs", "testthat", "withr"), repos = "https://cloud.r-project.org")'

      - name: Run automated tests
        run: |
          Rscript -e 'testthat::test_file("tests/test-sample-tracker.R")'