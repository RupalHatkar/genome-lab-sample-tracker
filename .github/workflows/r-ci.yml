name: R CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run R tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::DBI
            any::RSQLite
            any::fs
            any::testthat
            any::withr
            any::plumber

      - name: Verify installed packages
        run: |
          Rscript -e 'library(DBI); library(RSQLite); library(fs); library(testthat); library(withr); library(plumber); cat("All R dependencies loaded successfully\n")'

      - name: Run automated tests
        run: |
          Rscript -e 'testthat::test_file("tests/test-sample-tracker.R")'