services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      SAMPLE_TRACKER_DB: "/data/samples.sqlite"
    volumes:
      - sample_tracker_data:/data

  shiny-ui:
    build:
      context: ../ui-shiny
      dockerfile: Dockerfile
    ports:
      - "3838:3838"
    environment:
      API_BASE_URL: "http://api:8001"
      SHINY_PORT: "3838"
    depends_on:
      - api

volumes:
  sample_tracker_data:
